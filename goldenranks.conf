<VirtualHost *:80>
    ServerName goldenranks.com
    ServerAlias www.goldenranks.com

    Redirect permanent / https://www.goldenranks.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName goldenranks.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/goldenranks.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/goldenranks.com/privkey.pem

    Redirect permanent / https://www.goldenranks.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.goldenranks.com
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/goldenranks.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/goldenranks.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.paypalobjects.com; script-src 'self' static.cloudflareinsights.com https://www.paypal.com 'unsafe-inline'; connect-src 'self' https://www.sandbox.paypal.com https://www.paypal.com; frame-src 'self' https://www.sandbox.paypal.com https://www.paypal.com;"
    
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyRequests Off
    ProxyPass /api/ http://localhost:3001/api/ connectiontimeout=5 timeout=30 keepalive=On
    ProxyPassReverse /api/ http://localhost:3001/api/

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        
        AllowOverride None
        
        Require all granted
    </Directory>
    
    FallbackResource /index.html

</VirtualHost>