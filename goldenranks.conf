<VirtualHost *:80>
    ServerName goldenranks.com
    ServerAlias www.goldenranks.com

    RewriteEngine On
    RewriteRule ^(.*)$ https://www.goldenranks.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName goldenranks.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/goldenranks.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/goldenranks.com/privkey.pem

    RewriteEngine On
    RewriteRule ^(.*)$ https://www.goldenranks.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.goldenranks.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/goldenranks.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/goldenranks.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    DocumentRoot /var/www/html
    
    ProxyRequests Off
    ProxyPass /api/ http://localhost:3001/api/
    ProxyPassReverse /api/ http://localhost:3001/api/
    
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        RewriteEngine On
        
        RewriteCond %{REQUEST_URI} !^/api/ [NC]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
</VirtualHost>